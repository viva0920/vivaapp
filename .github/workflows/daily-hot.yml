name: 每日抖音热点选题报告

on:
  schedule:
    # 北京时间 08:00（UTC 00:00）每日自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成热点报告
        run: node scripts/fetch-hot.js

      - name: 提交 hot-report.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hot-report.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日抖音热点报告 $(date +%F)"
            git push
          fi
